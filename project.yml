name: AlarmClock
options:
  bundleIdPrefix: com.devansh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  AlarmClock:
    type: application
    platform: iOS
    sources:
      - path: AlarmClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devansh.alarmclock
        DEVELOPMENT_TEAM: GBQ9HCSRG7
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: AlarmClock/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AlarmClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlarmClockTests
    dependencies:
      - target: AlarmClock
    settings:
      base:
        DEVELOPMENT_TEAM: GBQ9HCSRG7
schemes:
  AlarmClock:
    build:
      targets:
        AlarmClock: all
        AlarmClockTests: [test]
    test:
      targets:
        - AlarmClockTests
