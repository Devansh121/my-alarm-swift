name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    name: Build & test (iOS simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for devs in d.values() for dev in devs if 'iPhone' in dev['name']))")
          xcodebuild -project AlarmClock.xcodeproj -scheme AlarmClock \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO test | xcpretty && exit ${PIPESTATUS[0]}
